<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Positioning Master Demo</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- 10.13 Fixed Navbar -->
    <nav class="navbar">
      <strong>Web Programming</strong>
      <a href="#">Home</a>
      <a href="#">Lessons</a>
      <a href="#">Contact</a>
    </nav>

    <!-- Page Content with Padding-Top Compensation -->
    <main class="content">
      <h1>CSS Positioning</h1>

      <section>
        <!-- 10.14 Sticky Section Title -->
        <h2 class="section-title">Course Information</h2>

        <!-- 10.12 Relative Parent with Absolute Badge -->
        <div class="course-card">
          <span class="badge">NEW</span>
          <h3>CSS Web Design</h3>
          <p>Learn CSS Positioning with practical examples.</p>
        </div>
      </section>

      <section class="long-content">
        <h2 class="section-title">Practice Section</h2>
        <p>Scroll the page to test fixed and sticky positioning.</p>
        <p>More long content to enable page scrolling...</p>
      </section>
    </main>

    <!-- 10.15 Floating Action Button -->
    <button class="fab">+</button>
  </body>
</html>

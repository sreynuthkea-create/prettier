<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Form and Loops</title>
	<style>
		body {
			max-width: 720px;
			margin: 32px auto;
			padding: 0 20px;
			color: #202a35;
			font-family: Arial, sans-serif;
		}

		section {
			margin: 28px 0;
		}

		li {
			opacity: 0;
			animation: show-counter 400ms ease-out forwards;
			animation-delay: calc(var(--index) * 180ms);
		}

		@keyframes show-counter {
			from {
				opacity: 0;
				transform: translateX(-12px);
			}
			to {
				opacity: 1;
				transform: translateX(0);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			li {
				opacity: 1;
				animation: none;
			}
		}
	</style>
</head>
<body>
	<h1>HTML Form and Loops</h1>

	<section>
		<h2>Birthday</h2>
		<form onsubmit="showBirthday(event)">
			<label for="birthdayDay">Birthday (dd/mm/yyyy):</label>
			<select id="birthdayDay" name="day" required>
				<option value="">Day</option>
			</select>
			<select id="birthdayMonth" name="month" required>
				<option value="">Month</option>
			</select>
			<select id="birthdayYear" name="year" required>
				<option value="">Year</option>
			</select>
			<button type="submit">Submit</button>
		</form>
		<p id="birthdayOutput"></p>
	</section>

	<section>
		<h2>For loop: count from 1 to 10</h2>
		<div id="forOutput"></div>
	</section>

	<section>
		<h2>While loop: count from 1 to 5</h2>
		<p id="whileOutput"></p>
	</section>

	<section>
		<h2>Do while loop</h2>
		<p>A do-while loop runs the code once before checking its condition.</p>
		<label for="start">Select start number:</label>
		<select id="start">
			<option value="0">0</option>
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="3">3</option>
			<option value="4">4</option>
		</select>
		<button type="button" onclick="countFromSelection()">Run</button>
		<div id="output"></div>
	</section>

	<script>
        

		const daySelect = document.getElementById("birthdayDay");
		for (let day = 1; day <= 31; day++) {
			daySelect.add(new Option(day, day));
		}

		const months = [
			"January", "February", "March", "April", "May", "June",
			"July", "August", "September", "October", "November", "December"
		];
		const monthSelect = document.getElementById("birthdayMonth");
		for (let month = 0; month < months.length; month++) {
			monthSelect.add(new Option(months[month], month + 1));
		}

		const yearSelect = document.getElementById("birthdayYear");
		for (let year = new Date().getFullYear(); year >= 1900; year--) {
			yearSelect.add(new Option(year, year));
		}

		function showBirthday(event) {
			event.preventDefault();
			const day = Number(daySelect.value);
			const month = Number(monthSelect.value);
			const year = Number(yearSelect.value);
			const selectedDate = new Date(year, month - 1, day);
			document.getElementById("birthdayOutput").textContent =
				selectedDate.getDate() === day &&
				selectedDate.getMonth() === month - 1 &&
				selectedDate.getFullYear() === year
					? "Birthday: " + String(day).padStart(2, "0") + "/" +
						String(month).padStart(2, "0") + "/" + year
					: "Please select a valid date.";
		}

		let forHtml = "<ul>";
		let sumEven = 0;
		let sumOdd = 0;
		for (let number = 1; number <= 10; number++) {
			const isEven = number % 2 === 0;
			const status = isEven ? "Even" : "Odd";
			forHtml += `<li style="--index: ${number - 1}">Counter: ${number}, Status: ${status}</li>`;
			if (isEven) {
				sumEven += number;
			} else {
				sumOdd += number;
			}
		}
		forHtml += "</ul>";
		forHtml += `<p>Sum of Even Numbers: ${sumEven}</p>`;
		forHtml += `<p>Sum of Odd Numbers: ${sumOdd}</p>`;
		forHtml += `<p>Total Sum: ${sumEven + sumOdd}</p>`;
		document.getElementById("forOutput").innerHTML = forHtml;

		const whileNumbers = [];
		let number = 1;
		while (number <= 5) {
			whileNumbers.push(number);
			number++;
		}
		document.getElementById("whileOutput").textContent = whileNumbers.join(", ");

		function countFromSelection() {
			let i = Number(document.getElementById("start").value);
			const output = document.getElementById("output");
			output.innerHTML = "";

			do {
				output.innerHTML += "The number is " + i + "<br>";
				i++;
			} while (i < 5);
		}
        
	</script>
    
         
</body>
</html>
